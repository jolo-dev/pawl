name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      docker_images:
        description: "Docker images to cache (newline-separated)"
        required: false
        type: string

env:
  DOCKER_IMAGES: ${{ inputs.docker_images || '' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint and format check
        run: bunx biome check .

      - name: Restore Docker images
        id: cache
        uses: actions/cache@v4
        with:
          path: /tmp/tc-images.tar
          key: tc-docker-${{ hashFiles('.github/tc-docker.lock') }}

      - name: Load images if cache hit
        if: steps.cache.outputs.cache-hit == 'true'
        run: docker load -i /tmp/tc-images.tar

      - name: Set Docker images as env vars
        run: |
          echo "LOCALSTACK_IMAGE=$(grep localstack .github/tc-docker.lock)" >> $GITHUB_ENV
          echo "RYUK_IMAGE=$(grep ryuk .github/tc-docker.lock)" >> $GITHUB_ENV

      - name: Run tests
        # Known-broken and externally provisioned suites are tracked separately.
        # Keep the deterministic unit suite as the PR gate.
        run: |
          bun test \
            --path-ignore-patterns='example/some-service/tests/**' \
            --path-ignore-patterns='packages/cdk/tests/agentcore.test.ts' \
            --path-ignore-patterns='packages/cdk/tests/codebuild-project.test.ts' \
            --path-ignore-patterns='packages/cdk/tests/codecommit-review-events.test.ts' \
            --path-ignore-patterns='packages/cdk/tests/dynamodb-table.test.ts' \
            --path-ignore-patterns='packages/cdk/tests/basic-construct.test.ts' \
            --path-ignore-patterns='packages/cdk/tests/integration/**' \
            --path-ignore-patterns='packages/cli/tests/scaffold-*.test.ts' \
            --path-ignore-patterns='packages/cli/tests/aws-credentials.test.ts' \
            --path-ignore-patterns='packages/cli/tests/codecommit-init-entrypoint.test.ts' \
            --path-ignore-patterns='example/durable-lambda-reviewer/tests/security/synth-security.test.ts' \
            --path-ignore-patterns='example/durable-lambda-reviewer/tests/constructs/reviewer-stack.test.ts'

      - name: Cache Docker images
        if: success()
        run: |
          if [ -n "$DOCKER_IMAGES" ]; then
            images="$DOCKER_IMAGES"
          else
            images=$(cat .github/tc-docker.lock)
          fi

          for image in $images; do
            docker pull $image
          done

          docker save $images > /tmp/tc-images.tar
